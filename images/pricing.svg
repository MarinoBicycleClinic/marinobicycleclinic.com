<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <!-- Background Rectangles -->
  <rect x="0" y="0" width="400" height="400" fill="#66D37E"/> <!-- Theme green -->
  <rect x="400" y="0" width="400" height="400" fill="#007CB9"/> <!-- Theme blue -->
  <rect x="800" y="0" width="400" height="400" fill="#444"/> <!-- Theme charcoal -->
  <!-- Saved second-row backgrounds. To restore, uncomment these and the panels below,
       then change the viewBox back to "0 0 1200 800".
  <rect x="0" y="400" width="400" height="400" fill="#ba68c8"/> Purple
  <rect x="400" y="400" width="400" height="400" fill="#9e9e9e"/> Grey
  <rect x="800" y="400" width="400" height="400" fill="#7986cb"/> Blue
  -->

  <!-- Global Text Styles -->
  <style>
    .title { font-family: Arial, sans-serif; font-size: 26px; font-weight: bold; fill: white; text-anchor: middle; }
    .subtitle { font-family: Arial, sans-serif; font-size: 22px; font-weight: bold; fill: white; text-anchor: middle; }
    .item { font-family: Arial, sans-serif; font-size: 16px; fill: white; font-weight: bold; }
    .item-small { font-family: Arial, sans-serif; font-size: 14px; fill: white; }
    .price-tag-text { font-family: Arial, sans-serif; font-size: 20px; font-weight: bold; fill: black; text-anchor: middle; }
    .dark-text { fill: black; }
    .basic-panel text { fill: #222; }
    .disclaimer { font-family: Arial, sans-serif; font-size: 15px; font-weight: bold; fill: white; text-anchor: middle; }
    .html-text { color: white; font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; line-height: 1.4; text-align: center; }
    .html-text-small { font-size: 12px; font-style: italic; font-weight: normal; margin-top: 10px; }
  </style>

  <!-- GREEN PANEL (Basic Tune-up) -->
  <g class="basic-panel">
  <text x="200" y="60" class="title">BASIC BICYCLE</text>
  <text x="200" y="90" class="subtitle">Tune-up</text>
<text x="30" y="140" class="item">Clean grease off gears &amp; chain</text>
  <text x="30" y="165" class="item">Adjust brakes &amp; derailleurs</text>
  <text x="30" y="190" class="item">Lube cables &amp; pivot points as needed</text>
  <text x="30" y="215" class="item">True the wheels</text>
  <text x="30" y="240" class="item">Tighten all bolts &amp; hardware</text>
  <text x="30" y="265" class="item">Quick wipe down</text>
  <text x="30" y="290" class="item">Fill air in tires</text>
  <text x="30" y="315" class="item">Test ride &amp; safety check</text>

  </g>

  <!-- BLUE PANEL (Deluxe Tune-up) -->
  <text x="600" y="60" class="title">DELUXE</text>
  <text x="600" y="90" class="subtitle">Tune-up</text>
  <foreignObject x="430" y="120" width="340" height="260">
    <div xmlns="http://www.w3.org/1999/xhtml" class="html-text">
      Includes all adjustments in the Complete Tune-Up plus:
      <br/><br/>
      Full drive train clean (parts are removed and cleaned in parts washer)<br/>
      Full bike clean (frameset, components, and wheels cleaned and polished to remove all dirt and grime)
      <br/><br/>
      * Deluxe Tune-Ups will have a $20 miscellaneous parts estimate
    </div>
  </foreignObject>

  <!-- CHARCOAL PANEL (Complete Overhaul) -->
  <text x="1000" y="60" class="title">COMPLETE</text>
  <text x="1000" y="90" class="subtitle">Overhaul</text>
  <foreignObject x="830" y="120" width="340" height="260">
    <div xmlns="http://www.w3.org/1999/xhtml" class="html-text">
      A complete overhaul includes all of the above Tune-Up adjustments. The bike is completely taken apart, cleaned and the bearings are repacked (parts and bearings are extra).
      <br/><br/>
        * The overhaul tune-up will have a $20 miscellaneous parts estimate
    </div>
  </foreignObject>

  <!-- Saved second-row panels (uncomment with the backgrounds above to restore).
  BOTTOM PANELS (Retained from original)

  PURPLE BOX (Electric Bike Service)
  <text x="200" y="460" class="title">Electric Bike</text>
  <text x="200" y="490" class="subtitle">Service</text>
  <text x="40" y="550" class="item">E-Bike Tune up</text> <text x="320" y="550" class="item">$79</text>
  <text x="40" y="580" class="item">E-Bike tire/tube labor</text> <text x="320" y="580" class="item">$25</text>
  <text x="40" y="610" class="item">Electric/Oversized bike fee</text> <text x="320" y="610" class="item">$15</text>
  <text x="200" y="670" class="disclaimer">We do not do any electrical</text>
  <text x="200" y="690" class="disclaimer">work on E-bikes</text>
  <text x="200" y="730" class="disclaimer">Batteries must be removed</text>
  <text x="200" y="750" class="disclaimer">when checking in for service</text>

  GREY BOX (Other Services)
  <text x="600" y="460" class="title">Other Services</text>
  <text x="440" y="510" class="item">MAKE IT FAST <tspan font-size="12" font-weight="normal">(24-48 hrs)</tspan></text> <text x="730" y="510" class="item">$25</text>
  <text x="440" y="540" class="item">Adjustment</text> <text x="730" y="540" class="item">$20 &amp; up</text>
  <text x="440" y="565" class="item">Installation</text> <text x="730" y="565" class="item">$20 &amp; up</text>
  <text x="440" y="590" class="item">Overhaul</text> <text x="730" y="590" class="item">$20 &amp; up</text>
  <text x="440" y="615" class="item">Tire Install (per tire)</text> <text x="730" y="615" class="item">$10</text>
  <text x="440" y="640" class="item">Wheel Build (labor per)</text> <text x="730" y="640" class="item">$40</text>
  <text x="440" y="665" class="item">Detail &amp; Wax</text> <text x="730" y="665" class="item">$25</text>
  <text x="440" y="690" class="item">Dirty Bike fee</text> <text x="730" y="690" class="item">$20</text>
  <text x="440" y="715" class="item">Tire Disposal fee</text> <text x="730" y="715" class="item">$2</text>

  BLUE BOX (Flat Repair)
  <text x="1000" y="460" class="title">Flat Repair</text>
  <text x="1000" y="480" class="item-small" text-anchor="middle">(fixed while you wait)</text>
  <text x="840" y="550" class="item">Standard Tube</text> <text x="1120" y="550" class="item">$10</text>
  <text x="840" y="580" class="item">Heavy Duty or Fat tube</text> <text x="1120" y="580" class="item">$20</text>
  <text x="840" y="640" class="item">Standard bike Labor</text> <text x="1120" y="640" class="item">$10</text>
  <text x="840" y="670" class="item">E-Bike Labor</text> <text x="1120" y="670" class="item">$25</text>
  -->

  <!-- OVERLAYS -->

  <!-- Price Tag Red ($60) -->
  <g transform="translate(320, 60) rotate(30)">
    <polygon points="0,15 60,15 75,40 60,65 0,65" fill="white" />
    <circle cx="10" cy="40" r="4" fill="#66D37E" />
    <text x="40" y="48" class="price-tag-text">$60</text>
  </g>

  <!-- Price Tag Yellow ($85) -->
<g transform="translate(680, 30) rotate(20)">
    <polygon points="0,15 70,15 85,40 70,65 0,65" fill="white" />
    <circle cx="10" cy="40" r="4" fill="#007CB9" />
    <text x="45" y="48" class="price-tag-text">$85</text>
  </g>

  <!-- Price Tag Green ($190) -->
<g transform="translate(1100, 30) rotate(20)">
    <polygon points="0,15 70,15 85,40 70,65 0,65" fill="white" />
    <circle cx="10" cy="40" r="4" fill="#444" />
    <text x="45" y="48" class="price-tag-text">$190</text>
  </g>

